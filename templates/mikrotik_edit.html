{% extends "base.html" %}
{% block content %}

<div class="card card-primary">
  <div class="card-header"><h3 class="card-title">Edit Router MikroTik</h3></div>
  <form method="post">
    <div class="card-body">
      <div class="form-group">
        <label>ID Router</label>
        <input class="form-control" value="{{ router.id }}" disabled>
      </div>
      <div class="form-group">
        <label>Nama Router</label>
        <input name="label" class="form-control" value="{{ router.label }}">
      </div>
      <div class="form-group">
        <label>Host / IP</label>
        <input name="host" class="form-control" value="{{ router.host }}">
      </div>
      <div class="form-group">
        <label>Port</label>
        <input name="port" class="form-control" value="{{ router.port }}">
      </div>
      <div class="form-group">
        <label>Username</label>
        <input name="username" class="form-control" value="{{ router.username }}">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input name="password" class="form-control" value="{{ router.password }}">
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-success">💾 Simpan</button>
      <a href="/mikrotik" class="btn btn-secondary">⬅ Kembali</a>
    </div>
  </form>
</div>

{% endblock %}
