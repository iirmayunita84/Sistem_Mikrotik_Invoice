
{% extends "base.html" %}
{% block content %}

<h4>✏️ Edit Pelanggan Manual</h4>

<div class="card card-primary mt-3">

    <div class="card-header">
        <h3 class="card-title">
            Data Pelanggan
        </h3>
    </div>

    <form method="post" id="formEditPelanggan">

        <div class="card-body">

            <!-- NAMA -->
            <div class="form-group">
                <label>Nama Pelanggan</label>

                <input
                    class="form-control"
                    name="nama"
                    value="{{ p.nama or '' }}"
                    required>
            </div>


            <!-- PAKET -->
            <div class="form-group">
                <label>Paket</label>

                <input
                    class="form-control"
                    name="paket"
                    value="{{ p.paket or '' }}">
            </div>


            <!-- HARGA -->
            <div class="form-group">
                <label>Harga</label>

                <input
                    class="form-control"
                    name="harga"
                    type="number"
                    min="0"
                    value="{{ p.harga or 0 }}">
            </div>


            <!-- HP -->
            <div class="form-group">
                <label>No HP</label>

                <input
                    class="form-control"
                    name="hp"
                    value="{{ p.hp or '' }}"
                    placeholder="Contoh: 081234567890">
            </div>


            <!-- ALAMAT -->
            <div class="form-group">
                <label>Alamat</label>

                <textarea
                    class="form-control"
                    name="alamat"
                    rows="3">{{ p.alamat or '' }}</textarea>
            </div>


            <!-- ========================= -->
            <!-- JATUH TEMPO -->
            <!-- FORMAT DD/MM/YYYY -->
            <!-- ========================= -->

            <div class="form-group">

                <label>
                    Jatuh Tempo
                    <span class="text-danger">*</span>
                </label>

                <div class="input-group">

                    <input
                        type="text"
                        name="jatuh_tempo"
                        id="jatuh_tempo"
                        class="form-control"
                        value="{{ p.jatuh_tempo or '' }}"
                        placeholder="DD/MM/YYYY"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="off"
                        required>

                    <div class="input-group-append">

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="btnKalender"
                            title="Pilih tanggal">
                            📅
                        </button>

                    </div>

                </div>


                <!-- Kalender browser -->
                <input
                    type="date"
                    id="kalender_jatuh_tempo"
                    tabindex="-1"
                    aria-hidden="true"
                    style="
                        position:absolute;
                        width:1px;
                        height:1px;
                        opacity:0;
                        pointer-events:none;
                    ">


                <small class="form-text text-muted">
                    Format: DD/MM/YYYY.
                    Contoh: 05/10/2026 = 5 Oktober 2026.
                </small>

            </div>

        </div>


        <!-- FOOTER -->
        <div class="card-footer">

            <button
                type="submit"
                class="btn btn-primary"
                id="btnUpdate">
                💾 Update
            </button>

            <a
                href="/pelanggan"
                class="btn btn-secondary">
                Batal
            </a>

        </div>

    </form>

</div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const form =
            document.getElementById(
                "formEditPelanggan"
            );

        const tanggalText =
            document.getElementById(
                "jatuh_tempo"
            );

        const kalender =
            document.getElementById(
                "kalender_jatuh_tempo"
            );

        const btnKalender =
            document.getElementById(
                "btnKalender"
            );


        // =================================================
        // NORMALISASI TANGGAL AWAL
        // =================================================

        let tanggalAwal =
            tanggalText.value.trim();


        /*
         * FORMAT APLIKASI:
         * DD/MM/YYYY
         *
         * Jika database menggunakan YYYY-MM-DD,
         * ubah menjadi DD/MM/YYYY.
         */

        if (/^\\d{4}-\\d{2}-\\d{2}$/.test(tanggalAwal)) {

            const parts = tanggalAwal.split("-");

            tanggalText.value =
                parts[2] +
                "/" +
                parts[1] +
                "/" +
                parts[0];
        }


        // =================================================
        // FORMAT INPUT MANUAL
        // =================================================

        function formatTanggalInput(value) {

            let angka =
                value.replace(/\D/g, "");

            angka =
                angka.substring(0, 8);


            if (angka.length <= 2) {

                return angka;

            }


            if (angka.length <= 4) {

                return (
                    angka.substring(0, 2) +
                    "/" +
                    angka.substring(2)
                );

            }


            return (
                angka.substring(0, 2) +
                "/" +
                angka.substring(2, 4) +
                "/" +
                angka.substring(4, 8)
            );

        }


        tanggalText.addEventListener(
            "input",
            function () {

                this.value =
                    formatTanggalInput(
                        this.value
                    );

            }
        );


        // =================================================
        // VALIDASI TANGGAL
        // =================================================

        function tanggalValid(value) {

            if (
                !/^\d{2}\/\d{2}\/\d{4}$/.test(
                    value
                )
            ) {

                return false;

            }


            const parts =
                value.split("/");

            const month =
                parseInt(parts[0], 10);

            const day =
                parseInt(parts[1], 10);

            const year =
                parseInt(parts[2], 10);


            if (
                month < 1 ||
                month > 12 ||
                day < 1 ||
                day > 31
            ) {

                return false;

            }


            const d =
                new Date(
                    year,
                    month - 1,
                    day
                );


            return (
                d.getFullYear() === year &&
                d.getMonth() === month - 1 &&
                d.getDate() === day
            );

        }


        // =================================================
        // KALENDER
        // =================================================

        btnKalender.addEventListener(
            "click",
            function () {

                const value =
                    tanggalText.value.trim();


                /*
                 * DD/MM/YYYY
                 * menjadi
                 * YYYY-MM-DD
                 */

                if (
                    /^\d{2}\/\d{2}\/\d{4}$/.test(
                        value
                    )
                ) {

                    const parts =
                        value.split("/");

                    kalender.value =
                        parts[2] +
                        "-" +
                        parts[0] +
                        "-" +
                        parts[1];

                }


                if (
                    typeof kalender.showPicker ===
                    "function"
                ) {

                    kalender.showPicker();

                } else {

                    kalender.focus();
                    kalender.click();

                }

            }
        );


        // =================================================
        // HASIL PILIH KALENDER
        // =================================================

        kalender.addEventListener(
            "change",
            function () {

                if (!this.value) {
                    return;
                }


                const parts =
                    this.value.split("-");


                if (
                    parts.length !== 3
                ) {

                    return;

                }


                const year =
                    parts[0];

                const month =
                    parts[1];

                const day =
                    parts[2];


                /*
                 * YYYY-MM-DD
                 * menjadi
                 * DD/MM/YYYY
                 */

                tanggalText.value =
                    day +
                    "/" +
                    month +
                    "/" +
                    year;

            }
        );


        // =================================================
        // SUBMIT
        // =================================================

        form.addEventListener(
            "submit",
            function (event) {

                const value =
                    tanggalText.value.trim();


                if (
                    !tanggalValid(value)
                ) {

                    event.preventDefault();


                    alert(
                        "Format Jatuh Tempo harus DD/MM/YYYY.\n\n" +
                        "Contoh: 05/10/2026 = 5 Oktober 2026."
                    );


                    tanggalText.focus();

                    return false;

                }


                const btnUpdate =
                    document.getElementById(
                        "btnUpdate"
                    );


                if (btnUpdate) {

                    btnUpdate.disabled =
                        true;

                    btnUpdate.innerHTML =
                        "⏳ Menyimpan...";

                }

            }
        );

    }
);

</script>

{% endblock %}
